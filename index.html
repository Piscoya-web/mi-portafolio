<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo Fotográfico Familia Piscoya</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #f4f4f2; 
      --text-main: #111111;
      --text-muted: #666666;
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    #auth-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
    }
    .modal-content {
      max-width: 350px; width: 90%; text-align: center;
    }
    .modal-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem; margin-bottom: 5px;
    }
    .modal-content p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 30px; }
    .modal-content input {
      width: 100%; padding: 15px; margin-bottom: 15px;
      border: 1px solid #ddd; background: #ffffff; color: #111;
      border-radius: 4px; font-family: 'Inter', sans-serif;
      box-sizing: border-box; text-align: center; font-size: 1rem;
    }
    .modal-content button {
      width: 100%; padding: 15px;
      background: var(--text-main); color: #fff;
      border: none; cursor: pointer; font-size: 0.9rem;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 4px; transition: background 0.3s;
    }
    .modal-content button:hover { background: #333; }
    .error-msg { color: #d93025; font-size: 0.8rem; display: none; margin-top: 10px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 40px 5%;
    }
    .logo {
      font-family: 'Inter', sans-serif;
      font-weight: 600; font-size: 1.2rem; letter-spacing: -0.5px;
    }
    .user-info {
      font-size: 0.8rem; color: var(--text-muted);
    }

    .hero-title {
      padding: 0 5%;
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 6rem); 
      line-height: 1; margin: 20px 0 60px 0;
      letter-spacing: -2px;
    }

    .gallery-container {
      padding: 0 5% 100px;
      display: none; 
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 40px 20px;
    }
    .album-card {
      text-decoration: none; color: inherit;
      display: block; cursor: pointer;
    }
    
    .album-card:nth-child(3n+1) { grid-column: span 8; } 
    .album-card:nth-child(3n+2) { grid-column: span 4; } 
    .album-card:nth-child(3n+3) { grid-column: span 6; } 

    .album-image-wrapper {
      width: 100%; aspect-ratio: 4/3;
      overflow: hidden; background: #eaeaea;
    }
    .album-image-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .album-card:hover img { transform: scale(1.05); }
    
    .album-meta {
      margin-top: 15px;
      display: flex; gap: 15px;
    }
    .album-number {
      font-size: 2.5rem; font-family: 'Inter', sans-serif;
      font-weight: 300; line-height: 0.8; letter-spacing: -1px;
    }
    .album-details h3 {
      margin: 0; font-size: 0.9rem; font-weight: 600;
    }
    .album-details p {
      margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .grid { display: flex; flex-direction: column; gap: 50px; }
      .album-card { width: 100%; }
      header { padding: 20px 5%; }
    }
  </style>
</head>
<body>

  <div id="auth-modal">
    <div class="modal-content">
      <h1>Piscoya.</h1>
      <p>Archivo Histórico Familiar</p>
      
      <input type="email" id="user-email" placeholder="Correo electrónico" required>
      <input type="password" id="birth-year" placeholder="Año de nacimiento (Ej: 1965)" required>
      <button onclick="verificarAcceso()">Ingresar al archivo</button>
      
      <p id="error-msg" class="error-msg">Credenciales incorrectas.</p>
    </div>
  </div>

  <header>
    <div class="logo">Piscoya.</div>
    <div class="user-info" id="user-display"></div>
  </header>

  <h1 class="hero-title">Álbumes<br>Fotográficos</h1>

  <main class="gallery-container" id="galeria-container">
    <div class="grid" id="grid-albumes"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  
  <script>
    const SUPABASE_URL = 'https://mpgpvxrqnulskmepmur.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcGd2eHJxbnVsc2ttZXBtdXJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTkzNjQsImV4cCI6MjA5ODgzNTM2NH0.z2b41M54eZx7Xx4OONDfY9xjfuwSm6ov8TmKFUrLCPk';
    const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    Fancybox.bind('[data-fancybox]', {
      Carousel: { transition: "fade" },
      Images: { zoom: false },
      Toolbar: { display: { left: ["infobar"], middle: [], right: ["close"] } }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const usuarioActivo = localStorage.getItem('usuario_activo');
      if (usuarioActivo) {
        desbloquearWeb(usuarioActivo);
      }
    });

    async function verificarAcceso() {
      const email = document.getElementById('user-email').value.trim();
      const anioStr = document.getElementById('birth-year').value.trim();
      
      if (!email || !anioStr) {
        document.getElementById('error-msg').innerText = "Llena todos los campos.";
        document.getElementById('error-msg').style.display = 'block';
        return;
      }

      const { data, error } = await clienteSupabase
        .from('formulario_familia')
        .select('nombre_completo, correo')
        .eq('correo', email)
        .eq('anio_nacimiento', parseInt(anioStr))
        .single();

      if (error || !data) {
        document.getElementById('error-msg').innerText = "Credenciales incorrectas.";
        document.getElementById('error-msg').style.display = 'block';
      } else {
        localStorage.setItem('usuario_activo', data.nombre_completo);
        localStorage.setItem('usuario_correo', data.correo);
        desbloquearWeb(data.nombre_completo);
      }
    }

    function desbloquearWeb(nombreUsuario) {
      document.getElementById('auth-modal').style.display = 'none';
      document.getElementById('galeria-container').style.display = 'block';
      document.getElementById('user-display').innerText = `Visualizando como: ${nombreUsuario}`;
      cargarAlbumes();
    }

    async function cargarAlbumes() {
      const { data: albums, error } = await clienteSupabase
        .from('albums')
        .select('*')
        .order('id', { ascending: true });
        
      if (error) { console.error('Error:', error); return; }

      const contenedor = document.getElementById('grid-albumes');
      contenedor.innerHTML = '';

      albums.forEach((album, index) => {
        const numeroFormateado = String(index + 1).padStart(2, '0') + ".";
        const card = document.createElement('a');
        card.className = 'album-card';
        card.href = album.cover_url;
        card.setAttribute('data-fancybox', `gallery-${album.id}`);
        card.setAttribute('data-caption', album.title);

        card.innerHTML = `
          <div class="album-image-wrapper">
            <img src="${album.cover_url}" alt="${album.title}" loading="lazy">
          </div>
          <div class="album-meta">
            <div class="album-number">${numeroFormateado}</div>
            <div class="album-details">
              <h3>${album.title}</h3>
              <p>${album.photo_count || 0} fotografías</p>
            </div>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }
  </script>
</body>
</html>
